# sam-ui CI on pull requests and on main: Biome (lint, formatting and import order), the kit script's tests,
# and the site in apps/hoo built the way GitHub Pages serves it (a static export under /sam-ui), which
# type-checks every kit file and bundles the ones the site imports. plugin validate needs the claude CLI, so
# it runs in `pnpm release` locally.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      # pnpm comes first: setup-node caches the pnpm store, and the version comes from packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
        env:
          PAGES: "1"
          NEXT_PUBLIC_BASE_PATH: /sam-ui
